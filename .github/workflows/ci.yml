name: CI

on:
  push:
  pull_request:

jobs:
  philo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install norminette
        run: python -m pip install norminette

      - name: Run norm and tests
        run: make -C philo ci
